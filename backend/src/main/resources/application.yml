spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: nexora-backend
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=nexora;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:change-me-local-sa-password-123!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        use_nationalized_character_data: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://nexora_root:change-me-local-mongo-password@localhost:27017/nexora?authSource=admin}
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    # Local fallback only. Set JWT_SECRET outside local development.
    jwt-secret: ${JWT_SECRET:change-this-local-development-secret-32bytes}
  mongodb:
    backfill:
      enabled: ${MONGO_BACKFILL_ENABLED:false}
  file-storage:
    root: ${FILE_STORAGE_ROOT:../.data/uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
